}

function closeManager() {
  var m = document.getElementById('cmModal');
  if (m) m.classList.remove('on');
  wasOpen = false;
  hydrateCourse(); render();
}

function switchLang(lang) {
  if (!lang || LS.lang === lang) return;
  if (editModeOn) collectAll();
  LS.lang = lang; lsSet('gjps_lang', lang);
  loadDone(); loadSkip(); setLabels();
  ['vfModal', 'pubModal', 'pubPanel', 'idocModal', 'idocForm', 'appForm', 'prepModal'].forEach(function (id) {
    var e2 = document.getElementById(id); if (e2) e2.classList.remove('on');
  });
  window.__gjNoCollect = true; hydrateCourse(); render(); window.__gjNoCollect = false;
  applyManagerLang();
  P.snap = levelIds(P.lvl).slice();
  P.undo.length = 0; P.redo.length = 0;
  paintManager();
  lastSig = '';
  applyView(false);
}

<script>

(function () {
  'use strict';
  if (window.__gjPasteClean) return; window.__gjPasteClean = true;

  function editableHost(t) {
    if (!t) return null;
    if (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT') return null;
    if (t.isContentEditable) return t;
    return t.closest ? t.closest('[contenteditable="true"]') : null;
  }
  function isOneLine(host) {
    if (!host) return false;
    if (host.classList && host.classList.contains('vt')) return true;
    var k = host.getAttribute('data-ovk') || host.getAttribute('data-fqk') ||
            host.getAttribute('data-ovak') || host.getAttribute('data-appk') ||
            host.getAttribute('data-hk');
    // TÍTOLS i NOMES són 1 línia. Les RESPOSTES ('a') i PARÀGRAFS ('p') són multilínia.
    return k === 't' || k === 'q' || k === 'n';
  }
  function buildFrag(text, oneLine) {
    text = String(text).replace(/\r\n?/g, '\n');
    if (oneLine) text = text.replace(/\s*\n\s*/g, ' ').trim();
    var frag = document.createDocumentFragment(), last = null, parts = text.split('\n');
    for (var i = 0; i < parts.length; i++) {
      if (i > 0) { var br = document.createElement('br'); frag.appendChild(br); last = br; }
      if (parts[i]) { var tn = document.createTextNode(parts[i]); frag.appendChild(tn); last = tn; }
    }
    return { frag: frag, last: last };
  }

  document.addEventListener('paste', function (e) {
    var host = editableHost(e.target);
    if (!host) return;
    var cd = e.clipboardData || window.clipboardData;
    if (!cd) return;
    var text = cd.getData('text/plain');
    if (text == null) return;
    e.preventDefault();

    var built = buildFrag(text, isOneLine(host));
    var sel = window.getSelection(), range = null;
    if (sel && sel.rangeCount) {
      var r = sel.getRangeAt(0);
      if (host.contains(r.commonAncestorContainer)) range = r;   // selecció vàlida DINS del camp
    }
    if (!range) {                                                 // selecció fantasma → caure al camp
      range = document.createRange();
      range.selectNodeContents(host);
      range.collapse(false);
      if (sel) { sel.removeAllRanges(); sel.addRange(range); }
    }
    range.deleteContents();
    range.insertNode(built.frag);

      var after = document.createRange();
      after.setStartAfter(built.last); after.collapse(true);
      if (sel) { sel.removeAllRanges(); sel.addRange(after); }
    }

(function () {

(function () {
  'use strict';
  if (window.__gjNewsBeatJs) return; window.__gjNewsBeatJs = true;
  function tick(ts) {
    requestAnimationFrame(tick);
    var b = document.getElementById('gjNewsBtn');
    if (!b) return;
    var svg = b.querySelector('svg');
    if (!b.classList.contains('fresh')) {
      if (b.__gjBeatOn) {
        b.__gjBeatOn = false;
        b.style.transform = ''; b.style.boxShadow = ''; b.style.animation = '';
        if (svg) { svg.style.transform = ''; svg.style.animation = ''; }
      }
      return;
    }
    b.__gjBeatOn = true;
    b.style.animation = 'none';
    if (svg) { svg.style.animation = 'none'; svg.style.transformOrigin = '50% 3px'; }
    var t = (ts % 2400) / 2400;
    var beat = 0;
    if (t < 0.08) beat = t / 0.08;
    else if (t < 0.16) beat = 1 - (t - 0.08) / 0.08;
    else if (t < 0.26) beat = 0.6 * (t - 0.16) / 0.10;
    else if (t < 0.34) beat = 0.6 * (1 - (t - 0.26) / 0.08);
    var sc = 1 + 0.22 * beat;
    var ring = Math.sin(t * Math.PI);
    var spread = (12 * ring).toFixed(1);
    var alpha = (0.55 * (1 - ring)).toFixed(3);
    var glow = (0.25 + 0.20 * ring).toFixed(3);
    b.style.transform = 'scale(' + sc.toFixed(3) + ')';
    b.style.boxShadow = '0 0 0 ' + spread + 'px rgba(232,176,75,' + alpha + '), 0 0 ' +
      (14 + 12 * ring).toFixed(0) + 'px ' + (3 + 5 * ring).toFixed(0) + 'px rgba(232,176,75,' + glow + ')';
    if (svg) {
      var rot = 0;
      if (t < 0.6) rot = 20 * Math.sin(t / 0.6 * Math.PI * 3) * (1 - t / 0.6);
      svg.style.transform = 'rotate(' + rot.toFixed(1) + 'deg)';
    }
  }
  requestAnimationFrame(tick);
})();
</script>

    var v = normOne(OV.va[id]);
    v[LS.lang] = (keys || []).slice();
    OV.va[id] = v;
  };

  window.adjListOf = function (id, track) {
    try {
      var x = findVidById(id);
      if (!x || isDocId(id)) return [];
      var out = [], seen = {};
      function push(si, ui, bb, i) {
        var dc = (docsOf(si, ui, bb) || [])[i];
        var link = getAdjLink(si, ui, bb, i);
        if (dc && !dc[3] && dc[li()] && link && !seen[link]) {
          seen[link] = 1; out.push({ n: dc[li()], l: link, t: dc[2] }); return true;
        }
        return false;
      }
      var ALLB = ['w', 't', 'g', 'r', 'a', 'p'];
      (window.getVidAdjKeys(id) || []).forEach(function (k) {
        var p = String(k).split('.');
        var si = +p[0], ui = +p[1], i = (p.length >= 4 ? +p[3] : +p[2]);
        for (var q = 0; q < ALLB.length; q++) { if (push(si, ui, ALLB[q], i)) return; }
        Object.keys(OV.adj || {}).forEach(function (ak) {
          var ap = String(ak).split('.');
          if (+ap[0] === si && +ap[1] === ui && +ap[3] === i) push(si, ui, ap[2], i);
        });
      });
      return out;
    } catch (e) { return []; }
  };

  var _base = window.hasPrep;
  window.hasPrep = function (id) {
    try {
      if (_base && _base(id)) return true;
      var d = OV.d && OV.d[id] && OV.d[id][LS.lang];
      if (d && String(d).trim()) return true;
      return window.adjListOf(id, false).length > 0;
    } catch (e) { return false; }
  };

  var okBtn = document.getElementById('adjSelOk');
  if (okBtn) {
    okBtn.onclick = function () {
      var st = window.adjSelState;
      if (!st) return;
      try {
        window.setVidAdjKeys(st.id, (st.currentSelection || []).slice());
        normAll();
        var n = window.getVidAdjKeys(st.id).length;
        console.log('GJPS · adjunts desats ' + st.id + ' (' + LS.lang + '):', JSON.stringify(OV.va[st.id]));
        showToast(n
          ? (LS.lang === 'ca' ? '💾 ' + n + ' adjunt' + (n > 1 ? 's' : '') + ' desat' + (n > 1 ? 's' : '') + ' per a aquest vídeo'
                              : '💾 ' + n + ' adjunto' + (n > 1 ? 's' : '') + ' guardado' + (n > 1 ? 's' : '') + ' para este vídeo')
          : (LS.lang === 'ca' ? '💾 Desat: aquest vídeo no mostrarà adjunts' : '💾 Guardado: este vídeo no mostrará adjuntos'));
      } catch (e) {
        try { console.error('GJPS · error desant adjunts', e); } catch (e2) {}
      }
      try {
        var m = document.getElementById('adjSelModal');
        if (m) m.classList.remove('on');
        window.adjSelState = null;
        render();
      } catch (e) {}
    };
  }
})();
</script>
<script>
/* ═══ GJPS · CACHE BUSTER v1 · força recàrrega automàtica ═══ */
(function () {
  'use strict';
  var CURRENT_VERSION = 'v6.0.1'; // Incrementa quan facis canvis importants
  
  // Guarda la versió actual al localStorage
  var storedVersion = localStorage.getItem('gjps_app_version');
  if (storedVersion !== CURRENT_VERSION) {
    // Força recàrrega amb cache busting
    var url = new URL(window.location.href);
    url.searchParams.set('_v', Date.now());
    localStorage.setItem('gjps_app_version', CURRENT_VERSION);
    // Només recarrega si no acabem d'arribar amb un paràmetre de versió
    if (!url.searchParams.has('_forceReload')) {
      url.searchParams.set('_forceReload', '1');
      window.location.replace(url.toString());
    }
  }
  
  // Neteja el paràmetre de recàrrega després de 2 segons
  setTimeout(function () {
    var url = new URL(window.location.href);
    if (url.searchParams.has('_forceReload')) {
      url.searchParams.delete('_forceReload');
      url.searchParams.delete('_v');
      window.history.replaceState({}, '', url.toString());
    }
  }, 2000);
})();
</script>
